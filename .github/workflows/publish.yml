name: Publish

# ─────────────────────────────────────────────────────────────────────────────
# 发布链路（规则见 docs/rules.md 第 10 节）
#
# 一个仓库级标签可以发布多个包，发哪些由清单版本变化决定。标签用根目录命令生成：
#
#   pnpm release                        # 形如 release/20261110-153012（时间戳，同一天可发多批）
#
#   ① 取「上一个可达的 release/* 标签 → 本标签」区间
#   ② 挑出 manifest.json 有变化、且 version 真的变大的包（新包也算）
#   ③ 首次打标签时前面没有更早的标签 → 只建立基准，不发布
#   ④ 逐个构建并推到各自的收录仓库 TCOTC/<name>，tag 用 v<version>
#
# 所以「只改代码、不抬 version」不会发布；要补发漏掉的包用 workflow_dispatch 的 packages。
#
# 三个必须遵守的点：
#   1. 跨仓库写必须用 PAT，GITHUB_TOKEN 只能写本仓库
#   2. 必须建「正式」release，prerelease 不会进集市索引
#   3. 目标收录仓库里不能残留旧的发布工作流，否则创建 tag 会触发它重复构建
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags: ["release/*"]
  workflow_dispatch:
    inputs:
      base:
        description: "对比基准；留空则自动取最近一个可达的 release/* 标签"
        required: false
      packages:
        description: "只发这些包（包目录名，逗号分隔）；留空则按清单版本变化自动检测"
        required: false
      force:
        description: "允许覆盖目标仓库已存在的同版本 release"
        type: boolean
        default: false
      dry_run:
        description: "只构建与校验，不创建 release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要用「上一个标签 → 本标签」做 diff，浅克隆拿不到历史与别的标签
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 检测要发布的包
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: node .github/scripts/detect-packages.mjs

      - name: 构建并发布
        if: steps.detect.outputs.count != '0'
        env:
          # fine-grained PAT，contents: write，覆盖全部收录仓库
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          PACKAGES: ${{ steps.detect.outputs.list }}
        run: |
          # 不用 set -e：一个包失败不能挡住其它包，最后统一汇总
          set -uo pipefail

          DRY_RUN="false"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "${INPUT_DRY_RUN:-}" = "true" ]; then
            DRY_RUN="true"
          fi
          FORCE="false"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "${INPUT_FORCE:-}" = "true" ]; then
            FORCE="true"
          fi

          if [ "$DRY_RUN" != "true" ] && [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 PUBLISH_TOKEN secret（fine-grained PAT，contents: write）"
            exit 1
          fi

          published=0
          failed=()

          # 用数组而不是 while read：构建工具偶尔读 stdin，会把还没读的清单吞掉（漏包很难发现）
          mapfile -t LINES <<< "$PACKAGES"

          for line in "${LINES[@]}"; do
            IFS=$'\t' read -r DIR NAME VERSION TARGET <<< "$line"
            if [ -z "${DIR:-}" ]; then
              continue
            fi
            echo "::group::${NAME} ${VERSION} → ${TARGET}"

            if ! pnpm --dir "$DIR" build; then
              echo "::error::${NAME} 构建失败"
              failed+=("${NAME}: 构建失败")
              echo "::endgroup::"
              continue
            fi

            ZIP="dist/${NAME}.zip"
            if [ ! -f "$ZIP" ]; then
              echo "::error::没有产出 $ZIP"
              failed+=("${NAME}: 没有产出 zip")
              echo "::endgroup::"
              continue
            fi

            # 集市要求清单在 zip 根目录（不能多一层包装目录）。
            # 用 case 匹配而不是 `grep -m1`：grep 命中后提前退出会让上游吃 SIGPIPE，
            # 在 pipefail 下整条管道会被判成失败（同一类坑见下面的 ASSETS 检查）。
            ENTRIES=$(unzip -Z1 "$ZIP")
            ARTIFACT=""
            while IFS= read -r entry; do
              case "$entry" in
                plugin.json | theme.json | widget.json)
                  ARTIFACT="$entry"
                  break
                  ;;
              esac
            done <<< "$ENTRIES"
            if [ -z "$ARTIFACT" ]; then
              echo "::error::zip 根目录缺少清单文件"
              printf '%s\n' "$ENTRIES"
              failed+=("${NAME}: zip 根目录缺清单")
              echo "::endgroup::"
              continue
            fi

            # 检测阶段读的是合成清单，这里核对产物里那一份，防「检测与构建不是同一棵树」
            BUILT_VERSION=$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(m.version))' "dist/${NAME}/${ARTIFACT}")
            if [ "$BUILT_VERSION" != "$VERSION" ]; then
              echo "::error::产物清单 version 是 ${BUILT_VERSION}，与检测到的 ${VERSION} 不一致"
              failed+=("${NAME}: 版本不一致")
              echo "::endgroup::"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run：跳过创建 release（将发布 v${VERSION} 到 ${TARGET}）"
              published=$((published + 1))
              echo "::endgroup::"
              continue
            fi

            TAG="v${VERSION}"
            cp "$ZIP" package.zip

            if gh release view "$TAG" --repo "$TARGET" > /dev/null 2>&1; then
              # 集市要求 version 单调递增；同版本覆盖会让已安装用户收不到更新
              if [ "$FORCE" != "true" ]; then
                echo "::error::${TARGET} 已存在 ${TAG}，请先抬清单 version 再发（或手动指定 force）"
                failed+=("${NAME}: ${TAG} 已存在")
                echo "::endgroup::"
                continue
              fi
              echo "${TARGET} 已有 ${TAG}，force 覆盖资产"
              if ! gh release upload "$TAG" package.zip --repo "$TARGET" --clobber; then
                echo "::error::${NAME} 覆盖资产失败"
                failed+=("${NAME}: 覆盖资产失败")
                echo "::endgroup::"
                continue
              fi
            elif ! gh release create "$TAG" package.zip --repo "$TARGET" --title "$TAG" --generate-notes; then
              # 注意：不要加 --prerelease，集市只读 /releases/latest
              echo "::error::${NAME} 创建 release 失败"
              failed+=("${NAME}: 创建 release 失败")
              echo "::endgroup::"
              continue
            fi

            # 集市按资产名找 package.zip，名字错了等于没发。
            # 先落到变量再 grep：`gh ... | grep -qx` 的提前退出会让 gh 吃 SIGPIPE，
            # 在 pipefail 下整条管道会被判成失败。
            ASSETS=$(gh release view "$TAG" --repo "$TARGET" --json assets --jq '.assets[].name')
            if ! grep -qx 'package.zip' <<< "$ASSETS"; then
              echo "::error::${TARGET} 的 ${TAG} 里没有 package.zip 资产"
              failed+=("${NAME}: 缺 package.zip 资产")
              echo "::endgroup::"
              continue
            fi

            echo "已发布 ${TARGET}@${TAG}"
            published=$((published + 1))
            echo "::endgroup::"
          done

          echo "成功 ${published} 个，失败 ${#failed[@]} 个"
          if [ ${#failed[@]} -gt 0 ]; then
            # $GITHUB_STEP_SUMMARY 在本地跑时不存在，`set -u` 下直接展开会中止脚本
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## 发布失败的包"
                echo
                printf -- '- %s\n' "${failed[@]}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '%s\n' "${failed[@]}"
            exit 1
          fi

      - name: 汇总
        if: steps.detect.outputs.count == '0'
        run: echo "本次没有需要发布的包，详见上方检测步骤的输出"
