name: Publish

# ─────────────────────────────────────────────────────────────────────────────
# 草稿：尚未在真实仓库上验证。骨架阶段只允许手动触发，避免误发。
#
# 正式接入后把触发器改成按 tag 发布，tag 约定 `<包目录名>/v<version>`：
#
#   on:
#     push:
#       tags: ["*/v*"]
#
# 然后从 github.ref_name 里切出让包名与版本，并做一致性校验。
#
# 三个必须遵守的点（原因见根 README 第 8 节）：
#   1. 跨仓库写必须用 PAT，GITHUB_TOKEN 只能写本仓库
#   2. 必须建「正式」release，prerelease 不会进集市索引
#   3. 目标仓库原来的 release.yml 要先删掉，否则创建 tag 会触发它重复构建
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      package:
        description: "包目录名，例如 move-doc"
        required: true
      target:
        description: "目标收录仓库，例如 TCOTC/move-doc"
        required: true
      dry_run:
        description: "只构建，不创建 release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 定位包目录并读取版本
        id: meta
        env:
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          DIR=""
          for kind in plugins themes widgets; do
            if [ -d "$kind/$PKG" ]; then DIR="$kind/$PKG"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::找不到包目录 {plugins,themes,widgets}/$PKG"
            exit 1
          fi

          MANIFEST=$(ls "$DIR"/plugin.json "$DIR"/theme.json "$DIR"/widget.json 2>/dev/null | head -n1)
          VERSION=$(node -p "require('./$MANIFEST').version")

          # 集市要求清单里的 version 不带 v 前缀且单调递增，这里先拦住前缀问题
          case "$VERSION" in v*|V*) echo "::error::清单 version 不能带 v 前缀: $VERSION"; exit 1;; esac

          # 产物目录与 zip 用的是清单里的 name，不一定等于包目录名（主题 Whisper 就是如此）
          NAME=$(node -p "require('./$MANIFEST').name")

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 构建
        run: pnpm --dir "${{ steps.meta.outputs.dir }}" build

      - name: 产物与清单一致性检查
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.name }}"
          ZIP="dist/$NAME.zip"
          test -f "$ZIP" || { echo "::error::没有产出 $ZIP"; exit 1; }

          # 集市要求清单在 zip 根目录（不能多一层包装目录），且上传的资产名必须恰好是 package.zip
          unzip -Z1 "$ZIP" > /tmp/zip-entries.txt
          if ! awk '/^(plugin|theme|widget)\.json$/{found=1} END{exit !found}' /tmp/zip-entries.txt; then
            echo "::error::zip 根目录缺少清单文件"
            cat /tmp/zip-entries.txt
            exit 1
          fi
          echo "zip 根目录清单检查通过"

      - name: 创建 release
        if: ${{ !inputs.dry_run }}
        env:
          # fine-grained PAT，contents: write，覆盖全部收录仓库
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v$VERSION"
          TARGET="${{ inputs.target }}"
          NAME="${{ steps.meta.outputs.name }}"

          # 本地叫 <name>.zip，但集市按资产名找 package.zip，所以上传前改名
          cp "dist/$NAME.zip" package.zip

          # 幂等：已存在就只补传资产
          if gh release view "$TAG" --repo "$TARGET" > /dev/null 2>&1; then
            gh release upload "$TAG" package.zip --repo "$TARGET" --clobber
          else
            gh release create "$TAG" package.zip \
              --repo "$TARGET" \
              --title "$TAG" \
              --generate-notes
            # 注意：不要加 --prerelease
          fi

      # TODO(P4)：可选，把源码镜像回收录仓库，保住 GitHub 上的可浏览性。
      # 需要 fetch-depth: 0 与 subtree 拆分；与 release 的先后顺序要定。
      #
      # - name: 镜像源码
      #   if: ${{ !inputs.dry_run }}
      #   run: |
      #     git remote add mirror "https://x-access-token:${{ secrets.PUBLISH_TOKEN }}@github.com/${{ inputs.target }}.git"
      #     git subtree push --prefix "${{ steps.meta.outputs.dir }}" mirror main


