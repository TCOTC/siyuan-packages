name: Publish

# ─────────────────────────────────────────────────────────────────────────────
# 发布链路（原因见根 README 第 8 节）
#
# 主入口是按 tag 发布，tag 约定 `<包目录名>/v<version>`：
#
#   git tag move-doc/v1.0.3 && git push origin move-doc/v1.0.3
#
# 手动触发保留下来做 dry-run：只构建、校验 zip 结构，不创建 release。
#
# 三个必须遵守的点：
#   1. 跨仓库写必须用 PAT，GITHUB_TOKEN 只能写本仓库
#   2. 必须建「正式」release，prerelease 不会进集市索引
#   3. 目标仓库原来的 release.yml 要先删掉，否则创建 tag 会触发它重复构建
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "包目录名，例如 move-doc"
        required: true
      version:
        description: "版本号，不带 v，必须与清单一致"
        required: true
      target:
        description: "目标收录仓库 owner/repo；留空则从清单 url 推导"
        required: false
      dry_run:
        description: "只构建，不创建 release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 解析包名、版本与目标仓库
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # tag 形如 `move-doc/v1.0.3`：`${REF%%/*}` 取包目录名，`${REF#*/v}` 取版本
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PKG="$INPUT_PACKAGE"
            WANT_VERSION="$INPUT_VERSION"
            TARGET="$INPUT_TARGET"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            PKG="${REF_NAME%%/*}"
            WANT_VERSION="${REF_NAME#*/v}"
            TARGET=""
            DRY_RUN="false"
          fi

          if [ -z "$PKG" ] || [ -z "$WANT_VERSION" ] || [ "$WANT_VERSION" = "$REF_NAME" ]; then
            echo "::error::tag 必须形如 <包目录名>/v<version>，实际是 $REF_NAME"
            exit 1
          fi

          DIR=""
          for kind in plugins themes widgets; do
            if [ -d "$kind/$PKG" ]; then DIR="$kind/$PKG"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::找不到包目录 {plugins,themes,widgets}/$PKG"
            exit 1
          fi

          # 包内清单是覆盖层（没有 name / url），必须问 kit 要三层合成后的那一份，
          # 否则这里读到的 name 为空、url 缺失，发布目标会算错。
          if [ ! -f "$DIR/manifest.json" ]; then
            echo "::error::$DIR 下没有 manifest.json"
            exit 1
          fi

          read -r NAME VERSION MANIFEST_URL <<< "$(node kit/src/cli.ts manifest "$DIR" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log([m.name,m.version,m.url??""].join(" "))})')"

          # 集市要求清单里的 version 不带 v 前缀
          case "$VERSION" in v*|V*) echo "::error::清单 version 不能带 v 前缀: $VERSION"; exit 1;; esac

          # tag / 手动输入与清单必须逐字符一致：typo 会安静地发一个内容不对的版本
          if [ "$VERSION" != "$WANT_VERSION" ]; then
            echo "::error::版本不一致：tag 是 $WANT_VERSION，$DIR 合成后的清单是 $VERSION"
            exit 1
          fi

          # 目录名必须等于合成清单的 name（kit 从目录名推导，这里防一手推导逻辑回归）
          if [ "$(basename "$DIR")" != "$NAME" ]; then
            echo "::error::包目录名 $(basename "$DIR") 与合成清单 name $NAME 不一致"
            exit 1
          fi

          # 目标收录仓库：手动输入优先，否则从清单 url 推导，最后回退 TCOTC/<name>
          if [ -z "$TARGET" ] && [ -n "$MANIFEST_URL" ]; then
            TARGET=$(node -e 'const u = new URL(process.argv[1]); console.log(u.pathname.replace(/^\/|\/$/g, ""))' "$MANIFEST_URL")
          fi
          if [ -z "$TARGET" ]; then
            TARGET="TCOTC/$NAME"
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "包目录 $DIR / 名称 $NAME / 版本 $VERSION / 目标 $TARGET / dry_run=$DRY_RUN"

      - name: 构建
        run: pnpm --dir "${{ steps.meta.outputs.dir }}" build

      - name: 产物与清单一致性检查
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.name }}"
          ZIP="dist/$NAME.zip"
          test -f "$ZIP" || { echo "::error::没有产出 $ZIP"; exit 1; }

          # 集市要求清单在 zip 根目录（不能多一层包装目录），且上传的资产名必须恰好是 package.zip
          unzip -Z1 "$ZIP" > /tmp/zip-entries.txt
          if ! awk '/^(plugin|theme|widget)\.json$/{found=1} END{exit !found}' /tmp/zip-entries.txt; then
            echo "::error::zip 根目录缺少清单文件"
            cat /tmp/zip-entries.txt
            exit 1
          fi
          echo "zip 根目录清单检查通过"

      - name: 创建 release
        if: ${{ !inputs.dry_run }}
        env:
          # fine-grained PAT，contents: write，覆盖全部收录仓库
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v$VERSION"
          TARGET="${{ inputs.target }}"
          NAME="${{ steps.meta.outputs.name }}"

          # 本地叫 <name>.zip，但集市按资产名找 package.zip，所以上传前改名
          cp "dist/$NAME.zip" package.zip

          # 幂等：已存在就只补传资产
          if gh release view "$TAG" --repo "$TARGET" > /dev/null 2>&1; then
            gh release upload "$TAG" package.zip --repo "$TARGET" --clobber
          else
            gh release create "$TAG" package.zip \
              --repo "$TARGET" \
              --title "$TAG" \
              --generate-notes
            # 注意：不要加 --prerelease
          fi

      # TODO(P4)：可选，把源码镜像回收录仓库，保住 GitHub 上的可浏览性。
      # 需要 fetch-depth: 0 与 subtree 拆分；与 release 的先后顺序要定。
      #
      # - name: 镜像源码
      #   if: ${{ !inputs.dry_run }}
      #   run: |
      #     git remote add mirror "https://x-access-token:${{ secrets.PUBLISH_TOKEN }}@github.com/${{ inputs.target }}.git"
      #     git subtree push --prefix "${{ steps.meta.outputs.dir }}" mirror main


