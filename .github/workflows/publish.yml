name: Publish

# ─────────────────────────────────────────────────────────────────────────────
# 发布链路（规则见 docs/rules.md 第 10 节）
#
# 一个仓库级标签可以发布多个包，发哪些由清单版本变化决定。标签用根目录命令生成：
#
#   pnpm release                        # 形如 release/20261110-153012（时间戳，同一天可发多批）
#
#   ① 取「上一个可达的 release/* 标签 → 本标签」区间
#   ② 挑出 manifest.json 有变化、且 version 真的变大的包（新包也算）
#   ③ 首次打标签时前面没有更早的标签 → 只建立基准，不发布
#   ④ 逐个构建并推到各自的收录仓库 TCOTC/<name>，tag 用 v<version>
#
# 注意 release 正文：收录仓库里没有对应的提交（已归档只剩 README），所以不能用
# --generate-notes —— 正文由 publish.sh 按本仓的提交区间自己生成。
#
# 所以「只改代码、不抬 version」不会发布；要补发漏掉的包用 workflow_dispatch 的 packages。
#
# 具体实现都在 .github/scripts/ 下：检测是 detect-packages.mjs，构建与发布是 publish.sh。
# 那个循环有一百三十多行，塞在 YAML 里既没法 lint 也没法本地执行。
#
# 三个必须遵守的点：
#   1. 跨仓库写必须用 PAT，GITHUB_TOKEN 只能写本仓库
#   2. 必须建「正式」release，prerelease 不会进集市索引
#   3. 目标收录仓库里不能残留旧的发布工作流，否则创建 tag 会触发它重复构建
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags: ["release/*"]
  workflow_dispatch:
    inputs:
      base:
        description: "对比基准；留空则自动取最近一个可达的 release/* 标签"
        required: false
      packages:
        description: "只发这些包（包目录名，逗号分隔）；留空则按清单版本变化自动检测"
        required: false
      force:
        description: "允许覆盖目标仓库已存在的同版本 release"
        type: boolean
        default: false
      dry_run:
        description: "只构建与校验，不创建 release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 要用「上一个标签 → 本标签」做 diff，浅克隆拿不到历史与别的标签
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 检测要发布的包
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: node .github/scripts/detect-packages.mjs

      - name: 构建并发布
        if: steps.detect.outputs.count != '0'
        env:
          # fine-grained PAT，contents: write，覆盖全部收录仓库
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          PACKAGES: ${{ steps.detect.outputs.list }}
        run: bash .github/scripts/publish.sh

      - name: 汇总
        if: steps.detect.outputs.count == '0'
        run: echo "本次没有需要发布的包，详见上方检测步骤的输出"
