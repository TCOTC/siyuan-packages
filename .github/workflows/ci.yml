name: CI

on:
  push:
    branches: [main]
    # 改文档/编辑器配置不会影响任何包的产物，没必要跑全量
    # （README 不能进这里：它会被复制进 package.zip，check 也校验它与清单一致）
    paths-ignore: ["docs/**", ".vscode/**"]
  pull_request:
    paths-ignore: ["docs/**", ".vscode/**"]

# 连推多个提交时只验最后一次：前几次的结果已经没有意义，取消掉能省时间也省额度。
# 注意 group 里带 ref —— PR 与 main 是两条线，不能互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认 token 还会带 packages 等本流程用不到的权限；只留读代码
permissions:
  contents: read

jobs:
  check:
    # 钉具体镜像：ubuntu-latest 自 2026-10 起会迁移到 26.04，写 latest 既拿不到稳定行为，
    # 又会每次运行都挂一条「即将迁移」的注解。
    runs-on: ubuntu-26.04
    # 默认上限 360 分钟，卡住时白烧额度；本流程实测约 65s，留十倍余量。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # workflow 里的 uses: 写完整 semver tag，它对应的提交 SHA 记在 actions.lock。
      # 改了 uses: 却没重新生成锁文件时在这里失败：本地跑 `gh actions-lock` 即可修复。
      - name: 校验 workflow 锁文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      # 首次接入前需要先在本地 pnpm install 并把 pnpm-lock.yaml 提交上来，
      # 否则这里会因为缺少 lockfile 而失败。
      - run: pnpm install --frozen-lockfile

      # 先验结构再验内容：目录名 / 脚本 / 配置白名单 / 产物位置这些
      # 「构建阶段就能判定」的契约一旦漂移，后面的检查都会跑在错的输入上
      - run: pnpm check

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build all packages
        run: pnpm -r --if-present build

  # 只在 PR 上跑：Dependabot 的升级 PR 直接改 lockfile，这里拦「升到有已知漏洞的版本」。
  # 独立成一个 job，它的任何故障都不会影响上面的全量校验。
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5.0.0
        with:
          # 默认 low 起就失败会过吵；按 moderate 拦
          fail-on-severity: moderate


