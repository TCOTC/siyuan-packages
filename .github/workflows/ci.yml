name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # 首次接入前需要先在本地 pnpm install 并把 pnpm-lock.yaml 提交上来，
      # 否则这里会因为缺少 lockfile 而失败。
      - run: pnpm install --frozen-lockfile

      # 先验结构再验内容：目录名 / 脚本 / 配置白名单 / 产物位置这些
      # 「构建阶段就能判定」的契约一旦漂移，后面的检查都会跑在错的输入上
      - run: pnpm check

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build all packages
        run: pnpm -r --if-present build


