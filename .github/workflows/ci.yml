name: CI

on:
  push:
    branches: [main]
    # 改文档/编辑器配置不会影响任何包的产物，没必要跑全量
    # （README 不能进这里：它会被复制进 package.zip，check 也校验它与清单一致）
    paths-ignore: ["docs/**", ".vscode/**"]
  pull_request:
    paths-ignore: ["docs/**", ".vscode/**"]

# 连推多个提交时只验最后一次：前几次的结果已经没有意义，取消掉能省时间也省额度。
# 注意 group 里带 ref —— PR 与 main 是两条线，不能互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # workflow 里的 uses: 写完整 semver tag，它对应的提交 SHA 记在 actions.lock。
      # 改了 uses: 却没重新生成锁文件时在这里失败：本地跑 `gh actions-lock` 即可修复。
      - name: 校验 workflow 锁文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      # 首次接入前需要先在本地 pnpm install 并把 pnpm-lock.yaml 提交上来，
      # 否则这里会因为缺少 lockfile 而失败。
      - run: pnpm install --frozen-lockfile

      # 先验结构再验内容：目录名 / 脚本 / 配置白名单 / 产物位置这些
      # 「构建阶段就能判定」的契约一旦漂移，后面的检查都会跑在错的输入上
      - run: pnpm check

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build all packages
        run: pnpm -r --if-present build


