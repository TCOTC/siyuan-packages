name: CI

on:
  push:
    branches: [main]
    # 改文档/编辑器配置不会影响任何包的产物，没必要跑全量
    # （README 不能进这里：它会被复制进 package.zip，check 也校验它与清单一致）
    paths-ignore: ["docs/**", ".vscode/**"]
  pull_request:
    paths-ignore: ["docs/**", ".vscode/**"]

# 连推多个提交时只验最后一次：前几次的结果已经没有意义，取消掉能省时间也省额度。
# 注意 group 里带 ref —— PR 与 main 是两条线，不能互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      # 首次接入前需要先在本地 pnpm install 并把 pnpm-lock.yaml 提交上来，
      # 否则这里会因为缺少 lockfile 而失败。
      - run: pnpm install --frozen-lockfile

      # 先验结构再验内容：目录名 / 脚本 / 配置白名单 / 产物位置这些
      # 「构建阶段就能判定」的契约一旦漂移，后面的检查都会跑在错的输入上
      - run: pnpm check

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build all packages
        run: pnpm -r --if-present build


