packages:
  - "plugins/*"
  - "themes/*"
  - "widgets/*"
  - "kit"

# 升级思源 API 或构建工具时只改这里，所有包统一使用。
catalog:
  # 思源 API 类型，仓库为 https://github.com/siyuan-note/petal
  siyuan: "1.2.9"

  # 只在编译期用到、不随包发布的依赖
  # electron：install-package 仅用 `typeof import("electron")` 的两个成员（ipcRenderer / shell）做类型
  electron: "40.8.3"
  # install-package 用来给 GitHub API 响应补类型
  "@octokit/openapi-types": "^27.0.0"
  # 尚未发布到 npm 的内部共享包：沿用旧仓库的提交哈希，保证密文格式与旧版一致
  siyuan-token-vault: "git+https://github.com/TCOTC/siyuan-token-vault.git#8b666168a554f3038b58f0aed9823dd74a5a185d"

  # 构建工具链
  vite: "^8.3.6"
  vite-plugin-singlefile: "^2.3.4"
  sass: "^1.108.1"
  archiver: "^8.0.0"
  "@types/archiver": "^8.0.0"
  # 只用来读 zip 做产物对拍（verify），不参与构建
  fflate: "^0.8.3"

  # 代码质量
  typescript: "^6.0.3"
  # 格式化与 lint 都交给 oxc：一个工具链覆盖 TS / SCSS / Markdown / JSON
  oxfmt: "^0.77.0"
  oxlint: "^1.92.0"
  # 与 engines.node 的最低版本对齐：类型定义了 Node 的 API 面
  "@types/node": "^24.6.2"

  # 单元测试：
  vitest: "^5.1.0"
  # 插件里有直接操作 DOM 的纯函数，用 jsdom 提供 document
  jsdom: "^31.0.0"

allowBuilds:
  # sass 的可选原生依赖，用于 --watch
  "@parcel/watcher": false
  # 只用它的类型（install-package 的 window.require("electron")），
  # 不装 Electron 二进制；构建脚本显式拒绝，CI 也就不会去下那份几百 MB 的包
  electron: false
