packages:
  - "plugins/*"
  - "themes/*"
  - "widgets/*"
  - "libs/*"
  - "kit"

# 升级思源 API 或构建工具时只改这里，所有包统一使用。
catalog:
  # 思源 API 类型，仓库为 https://github.com/siyuan-note/petal
  #
  # 钉在 petal main 的具体提交上（而不是 npm 的 1.2.9）：插件真正需要的三处声明
  # 在已发布版本里还没有，只存在于 main。
  #   - Plugin.i18n 恢复成 Record<string, string>（67d2f50，petal issue #67）
  #   - open-menu-doctree 的 items 带 effectiveSortMode / childrenSortMode
  #   - Title.getText()（纯文本摘要）
  # 仍然是「单一真相源 + 单一 pin」：全仓 22 个包共用这一行。
  # petal 发布新版后改回并重新 typecheck 即可（届时应删掉各包的类型垫片）。
  siyuan: "github:siyuan-note/petal#edc4b0494a"

  # image-squeeze 的 WASM 编解码器（Squoosh 移植）。直接进产物，写精确版本，
  # 否则「与旧产物对拍」的 wasm 体积会随上游漂移。
  "@jsquash/jpeg": "1.6.0"
  "@jsquash/oxipng": "2.3.0"
  "@jsquash/webp": "1.5.0"

  # 只在编译期用到、不随包发布的依赖
  # electron：install-package 仅用 `typeof import("electron")` 的两个成员（ipcRenderer / shell）做类型
  electron: "45.2.3"
  # install-package 用来给 GitHub API 响应补类型
  "@octokit/openapi-types": "^29.0.1"

  # snippets 的编辑器与格式化运行时（会被打包进 index.js）。
  # 这里刻意写精确版本而不是 ^：它们直接进产物，版本漂移会让「与旧产物对拍」失去意义。
  "@codemirror/autocomplete": "6.20.4"
  "@codemirror/commands": "6.11.1"
  "@codemirror/lang-css": "6.3.1"
  "@codemirror/lang-javascript": "6.2.5"
  "@codemirror/language": "6.13.1"
  "@codemirror/search": "6.7.2"
  "@codemirror/state": "6.7.6"
  "@codemirror/view": "6.43.15"
  "@uiw/codemirror-theme-vscode": "4.25.12"
  acorn: "8.19.0"
  prettier: "3.9.10"

  # 构建工具链
  vite: "^8.3.6"
  vite-plugin-singlefile: "^2.3.4"
  sass: "^1.108.1"
  archiver: "^8.0.0"
  "@types/archiver": "^8.0.0"

  # 代码质量
  typescript: "^6.0.3"
  # 格式化与 lint 都交给 oxc：一个工具链覆盖 TS / SCSS / Markdown / JSON
  oxfmt: "^0.77.0"
  oxlint: "^1.92.0"
  # 与 engines.node 的最低版本对齐：类型定义了 Node 的 API 面
  "@types/node": "^24.6.2"

  # 单元测试：
  vitest: "^5.1.0"
  # 插件里有直接操作 DOM 的纯函数，用 jsdom 提供 document
  jsdom: "^31.0.0"

allowBuilds:
  # sass 的可选原生依赖，用于 --watch
  "@parcel/watcher": false
  # 只用它的类型（install-package 的 window.require("electron")），
  # 不装 Electron 二进制；构建脚本显式拒绝，CI 也就不会去下那份几百 MB 的包
  electron: false
